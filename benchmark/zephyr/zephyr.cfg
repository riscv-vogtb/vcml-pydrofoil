### General configuration ####################################################
system.name   = zephyr hello_world (rv32)
system.config = ${cfg}

system.throttle.rtf = 0

# TLM global quantum, a higher value improves performance but reduces timing
# accuracy.
system.quantum = 100ns

# hello_world prints once and then idles forever, so the run needs an end.
system.duration = 20ms

# Clock frequency, must match clock-frequency in sw/zephyr/dts/riscv/pydrofoil_vp.dtsi
system.clk_cpu.hz = 1000000000 # 1 GHz

### CPU configuration ########################################################
# The default is rv64 (sysc_vp/src/core.cpp:19), so rv32 has to say so.
system.core.arch_name = "rv32"
system.core.verbose   = false

system.core.symbols = ${dir}/../../sw/zephyr/app/hello_world/build/pydrofoil_32/zephyr.elf
system.core.elf     = ${dir}/../../sw/zephyr/app/hello_world/build/pydrofoil_32/zephyr.elf
system.core.pc      = 0x80000000

# Memory configuration
system.loader.images = ${dir}/../../sw/zephyr/app/hello_world/build/pydrofoil_32/zephyr.elf

# Must stay within SHADOW_SZ: every RAM write is mirrored to guest+0x40000000
# (POISON_INSTRUCTIONS.md:38), and the shadow region is only SRAM_SZ = 128 KiB
# (sysc_vp/include/system.h:30). ram0 in the board devicetree matches this.
system.ram = 0x80000000..0x8001FFFF

# Terminal configuration
# Note: the module is named "term" (sysc_vp/src/system.cpp:34); Luis' config
# still uses the older "term0".
system.term.backends = stdout
